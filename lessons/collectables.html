<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collectables — Mintly</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="nav-group">
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="financial-literacy.html">Lessons</a></li>
        <li><a href="../pricing.html">Pricing</a></li>
      </ul>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
    <a class="brand" href="../index.html">
      <img src="../assets/logo.svg" width="24" height="24" alt="">
      Mintly
    </a>
  </div>
</header>

<main>
  <div class="wrap empty-state">
    <div class="icon-big">🔒</div>
    <h2>Collectables is locked</h2>
    <p id="lock-message">Finish every Financial Literacy lesson to unlock this course.</p>
    <a class="btn" href="financial-literacy.html" id="lock-cta">Go to Financial Literacy</a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">Mintly · Financial learning for the next generation</div>
</footer>

<script src="../script.js"></script>
<script>
  Mintly.requireSubscription();
  if (Mintly.isCourseComplete()) {
    document.getElementById('lock-message').textContent = "You've unlocked Collectables — lessons are still being written. Check back soon.";
    document.getElementById('lock-cta').style.display = 'none';
    document.querySelector('.icon-big').textContent = '🃏';
    document.querySelector('h2').textContent = 'Collectables — coming very soon';
  } else {
    document.getElementById('lock-message').textContent =
      "You've completed " + Mintly.completedCount() + " of " + Mintly.LESSON_IDS.length +
      " Financial Literacy lessons. Finish them all to unlock this course.";
  }
</script>
</body>
</html>
