<main>

  </div>

  <section class="wrap poster-view">
    <div class="poster-frame" id="poster-frame">
      <iframe src="assets/mintly-poster.html" title="Mintly poster" width="2304" height="3456"></iframe>
    </div>
  </section>
</main>

<script src="script.js"></script>
<script>
  // The poster is a fixed 2304x3456 page; scale it to the frame's width.
  const frame = document.getElementById('poster-frame');
  const fit = () => frame.style.setProperty('--poster-scale', frame.clientWidth / 2304);
  new ResizeObserver(fit).observe(frame);
  fit();
</script>
